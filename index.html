<style>
:root{--bg:#080908;--fg:#eeeeeb;--muted:#8d938e;--acid:#ffffff;--alert:#b9ef59;--line:#373b34}
*{box-sizing:border-box}html{scroll-behaviour:smooth}body{margin:0;padding-top:40px;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
body:after{content:"";position:fixed;inset:0;z-index:10;pointer-events:none;opacity:.17;background-image:url('data:image/svg+xml,%3Csvg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)" opacity=".22"/%3E%3C/svg%3E')}
.shell{max-width:1600px;min-height:100svh;margin:auto;padding:28px clamp(22px,4.3vw,76px) 25px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.top,.foot,.section-header{display:flex;align-items:center;justify-content:space-between;gap:20px}.top{position:relative;z-index:2}.eyebrow,.top-right,.tag,.foot,.data-label,.enter,.section-header{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase}
.brand-small{display:inline-flex;align-items:center;gap:11px;color:var(--fg);text-decoration:none;font-weight:900;letter-spacing:-.06em;font-size:21px}.brand-small .dot{height:7px;width:7px;background:var(--acid);border-radius:50%;display:block}
.top-right{display:flex;gap:22px;color:var(--muted)}.top-right a{color:var(--fg);text-decoration:none}.top-right a:hover{color:var(--acid)}
.hero{position:relative;display:flex;flex-direction:column;justify-content:center;flex:1;min-height:430px;padding:75px 0 65px}
.signal-field{position:absolute;z-index:0;inset:0 -14vw 0 30%;opacity:.45;background:repeating-radial-gradient(ellipse at 56% 43%, transparent 0px, transparent 23px, #87977c25 24px,transparent 25px,transparent 53px);mask-image:linear-gradient(to right, transparent,black 55%,transparent)}
.hero-meta{display:flex;align-items:center;gap:12px;color:var(--fg);position:relative;z-index:1;font:11px 'Courier New',monospace;letter-spacing:.16em;text-transform:uppercase;margin-bottom:25px}
.pulse{width:7px;height:7px;border-radius:50%;background:#ff5500;box-shadow:0 0 14px rgba(255,85,0,.7);animation:blink 2s ease-in-out infinite}@keyframes blink{50%{opacity:.24}}
.logo{position:relative;z-index:1;width:min(82%,850px);margin-inline:auto;line-height:0;mix-blend-mode:screen}.logo svg{display:block;width:100%;height:auto;filter:invert(1)}
.hero-bottom{position:relative;z-index:1;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:22px;color:var(--muted);font:11px/1.7 'Courier New',monospace;text-transform:uppercase;letter-spacing:.13em}
.hero-bottom .line{height:1px;background:var(--line);flex:1;max-width:45%}
.music{border-top:1px solid var(--line);position:relative;padding:22px 0 27px}
.section-header{color:#fff;margin-bottom:24px}.section-header strong{font-weight:400;color:#fff}
.music-grid{display:grid;grid-template-columns:minmax(180px,.64fr) minmax(0,1.36fr);gap:5vw;align-items:center}
.music-intro h1{margin:0 0 15px;font-size:clamp(32px,4vw,68px);letter-spacing:-.065em;line-height:.93;font-weight:900;text-transform:uppercase}.music-intro h1 span{color:var(--acid)}
.music-intro p{font:11px/1.7 'Courier New',monospace;color:#fff;text-transform:uppercase;letter-spacing:.07em;max-width:320px;margin:0}
.player-wrap{min-width:0}.screen{border:1px solid #454a3f;background:#11140e;position:relative;min-height:166px;overflow:hidden}.screen:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--acid)}
.player-empty{min-height:166px;display:flex;flex-direction:column;justify-content:space-between;padding:19px 21px 17px}
.player-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font:10px 'Courier New',monospace;color:var(--acid);letter-spacing:.12em;text-transform:uppercase}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:54px;overflow:hidden;opacity:.82}.wave i{display:block;flex:1;max-width:5px;height:var(--h);background:var(--acid);transform:scaleY(.8);animation:wave 3s ease-in-out infinite;animation-delay:var(--delay)}@keyframes wave{50%{transform:scaleY(.4)}}
.player-caption{font:10px 'Courier New',monospace;color:#fff;letter-spacing:.1em;text-transform:uppercase}
#scFrame{display:none;width:100%;height:166px;border:0;background:#11140e}
#message{font:11px 'Courier New',monospace;color:#fff;min-height:14px;margin-top:9px}.foot{border-top:1px solid var(--line);padding-top:18px;margin-top:20px;color:#fff;font-size:10px}.foot span:last-child{color:#fff}
@media(max-width:750px){.shell{padding:22px 20px}.top-right{gap:10px;font-size:9px}.top-right .desktop{display:none}.hero{min-height:340px;padding:78px 0 53px}.hero-meta{font-size:9px}.hero-bottom{font-size:9px}.hero-bottom .line{display:none}.music-grid{grid-template-columns:1fr;gap:22px}.music-intro h1{font-size:42px}.player-empty{min-height:166px}.foot{font-size:9px;gap:12px;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behaviour:auto!important}}

/* Two-track release area */
.music-grid{display:block}
.links{justify-content:flex-end}
.music{padding:23px 0 30px}
.music-grid{grid-template-columns:minmax(150px,.56fr) minmax(0,1.44fr);align-items:start}
.release-list{border-top:1px solid var(--line)}
.release{display:grid;grid-template-columns:44px minmax(0,1fr) 74px;gap:17px;align-items:center;min-height:76px;padding:14px 4px;border-bottom:1px solid var(--line)}
.release-number,.release-caption,.release-state{font:10px/1.5 'Courier New',monospace;letter-spacing:.12em;text-transform:uppercase;color:#fff}
.release-number{color:#fff}
.release-title{font-size:clamp(18px,2vw,28px);letter-spacing:-.055em;font-weight:800;line-height:1.05;margin-bottom:6px}
.release-state{text-align:right}
.release-play{display:inline-flex;width:27px;height:27px;justify-content:center;align-items:center;border:1px solid #777;color:var(--fg);font:11px monospace;margin-left:7px;vertical-align:middle}
.links{display:flex;justify-content:flex-end;gap:24px;align-items:center;margin-top:24px}
.links a{font:11px 'Courier New',monospace;color:#fff;text-decoration:none;letter-spacing:.14em}
.links a:hover{color:#aaa}
.links a::after{content:' ↗';color:#fff}
.links-label{font:10px 'Courier New',monospace;color:#fff;letter-spacing:.13em;margin-right:auto}
@media(max-width:750px){.music-grid{grid-template-columns:1fr}.release{grid-template-columns:30px minmax(0,1fr) 54px;gap:10px}.links{gap:16px;flex-wrap:wrap}.links-label{width:100%}}
/* Restrained label introduction */
.label-description{margin:4px 0 26px;color:#fff;font:11px/1.7 'Courier New',monospace;letter-spacing:.09em;text-transform:uppercase;max-width:none;width:100%}
@media(max-width:750px){.logo{width:min(90%,850px)}.label-description{font-size:10px}}
/* Location bar: static document flow, no excess top spacing */
.shell{padding-top:0}
.coordinate-bar{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:20;padding:10px clamp(22px,4.3vw,76px);border-bottom:1px solid rgba(255,255,255,.12);background:rgba(8,9,8,.78);backdrop-filter:blur(3px);color:#fff;font:10px 'Courier New',monospace;letter-spacing:.14em;line-height:1}
.hero{min-height:300px;padding:26px 0 48px}
/* Clickable original demo tracks */
.release-play{cursor:pointer;background:transparent;border:1px solid #fff;border-radius:0;width:34px;height:34px;padding:0;color:#fff;margin:0;font:14px Arial,Helvetica,sans-serif}
.release-play:hover,.release-play:focus-visible{border-color:white;outline-offset:3px}
.pause-icon{display:none}.release.is-playing .pause-icon{display:inline}.release.is-playing .play-icon{display:none}
.release.is-playing .release-caption{color:#fff}
.test-note{margin:12px 0 0;color:#fff;font:10px 'Courier New',monospace;letter-spacing:.1em}
@media(max-width:750px){body{padding-top:36px}.coordinate-bar{padding:9px 20px;font-size:9px}.hero{min-height:260px;padding:28px 0 34px}}

/* Consistent grey secondary information */
.release-number,.release-title,.release-caption,.release-state,.test-note,.links a,.links a::after{color:#fff}
.release-play{color:#fff;border-color:#fff}
.release-play:hover,.release-play:focus-visible{color:#fff;border-color:#fff}
.release.is-playing .release-caption{color:#fff}

/* Responsive finishing pass: preserve the desktop art direction, improve mobile usability. */
html,body{min-width:0}
.shell{width:100%;min-width:0}
.logo svg{max-width:100%}
.release-title,.release-caption,.label-description{overflow-wrap:break-word}
.release-play{touch-action:manipulation}
.links a{display:inline-flex;align-items:center;min-height:44px;touch-action:manipulation}
@media(max-width:750px){
  body{padding-top:37px}
  .shell{padding:0 20px max(24px,env(safe-area-inset-bottom));min-height:100svh;overflow:hidden}
  .coordinate-bar{padding:11px max(20px,env(safe-area-inset-left)) 11px 20px;min-height:37px;gap:10px;letter-spacing:.1em;white-space:nowrap}
  .pulse{width:7px;height:7px;flex:0 0 7px}
  .hero{flex:0 0 auto;min-height:0;padding:clamp(62px,12vh,118px) 0 clamp(60px,11vh,112px)}
  .logo{width:min(88%,600px);margin-inline:auto}
  .signal-field{inset:-10% -45vw -10% 8%;opacity:.35}
  .music{padding:21px 0 18px}
  .label-description{font-size:10px;line-height:1.9;letter-spacing:.075em;margin:1px 0 23px;max-width:none;width:100%}
  .release{grid-template-columns:24px minmax(0,1fr) 48px;gap:12px;min-height:82px;padding:13px 0}
  .release-title{font-size:clamp(20px,6vw,27px);margin-bottom:8px}
  .release-number,.release-caption{font-size:10px}
  .release-play{width:44px;height:44px;margin:0;font-size:16px}
  .links{margin-top:21px;display:flex;justify-content:space-between;gap:8px 14px;flex-wrap:wrap}
  .links a{font-size:10px;letter-spacing:.08em;white-space:nowrap}
}
@media(max-width:360px){
  .shell{padding-left:16px;padding-right:16px}
  .coordinate-bar{padding-left:16px;padding-right:16px}
  .hero{padding-top:56px;padding-bottom:55px}
  .links{justify-content:flex-start;column-gap:19px}
  .links a{font-size:9.5px}
}
@media(orientation:landscape) and (max-height:500px) and (max-width:900px){
  .hero{padding-top:38px;padding-bottom:38px}
  .logo{width:min(62%,540px)}
}
/* Restore the original understated bottom bar and make it responsive. */
.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid rgba(255,255,255,.24);padding:20px 0 15px;margin-top:26px;color:#fff;font:10px/1.6 'Courier New',monospace;letter-spacing:.15em;text-transform:uppercase}
.foot span:last-child{color:#fff}
@media(max-width:750px){.foot{margin-top:20px;padding:16px 0 8px;gap:9px 16px;flex-wrap:wrap;font-size:9px;letter-spacing:.09em}.foot span{white-space:nowrap}}
@media(max-width:390px){.foot{flex-direction:column;align-items:flex-start;gap:5px}}
/* Final spacing refinement: links sit closer to the footer rule. */
.music{padding-bottom:7px}
.links{margin-top:16px}
.links a{min-height:30px}
.foot{margin-top:8px;padding-top:14px}
@media(max-width:750px){
  .music{padding-bottom:8px}
  .links{margin-top:16px}
  .links a{min-height:44px}
  .foot{margin-top:9px;padding-top:13px}
}

/* Seekable playback and restrained link behaviour */
.release{grid-template-columns:44px minmax(0,1fr) 74px;min-height:95px}
.release-title{margin-bottom:5px}
.track-seek{
  display:block;width:100%;max-width:100%;height:22px;margin:6px 0 0;
  padding:0;appearance:none;-webkit-appearance:none;cursor:pointer;
  border:0;border-radius:0;outline-offset:4px;background:transparent;
  touch-action:pan-y;
}
.track-seek::-webkit-slider-runnable-track{height:2px;border-radius:0;background:linear-gradient(to right,#fff 0%,#fff var(--progress),#444 var(--progress),#444 100%)}
